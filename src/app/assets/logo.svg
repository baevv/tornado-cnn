<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0D131C"/>
    </radialGradient>
    <linearGradient id="sweep" x1="32" y1="32" x2="58" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8950E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E8950E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="front" x1="16" y1="14" x2="40" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="45%" stop-color="#EB980E"/>
      <stop offset="100%" stop-color="#E3344E"/>
    </linearGradient>
    <linearGradient id="back" x1="16" y1="12" x2="42" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8520A"/>
      <stop offset="55%" stop-color="#911E37"/>
      <stop offset="100%" stop-color="#611227"/>
    </linearGradient>
    <clipPath id="badge">
      <circle cx="32" cy="32" r="31"/>
    </clipPath>
  </defs>

  <!-- Radar badge -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>

  <g clip-path="url(#badge)">
    <!-- Subtle radar sweep & range rings -->
    <path d="M32 32 L52 6 A32 32 0 0 1 63 29 Z" fill="url(#sweep)"/>
    <circle cx="32" cy="32" r="22.5" fill="none" stroke="#314158" stroke-width="0.9" stroke-opacity="0.65"/>
    <circle cx="32" cy="32" r="13" fill="none" stroke="#314158" stroke-width="0.9" stroke-opacity="0.5"/>

    <!-- Back turns of the 3D tornado helix -->
    <path d="M13 18 C13 12 51 11.5 51 17 C46.5 14.8 18.5 15.2 13 18 Z" fill="url(#back)"/>
    <path d="M47 22.8 C43.2 26 21.5 26.8 17.6 30.2 C20.8 25.4 41.5 24.4 47 22.8 Z" fill="url(#back)"/>
    <path d="M41.5 32.2 C38.5 34.8 25 35.6 22.5 38.6 C24.8 34.4 37 33.6 41.5 32.2 Z" fill="url(#back)"/>
    <path d="M36.5 40.5 C34.8 42.8 28.5 44 27.6 46.4 C29 43.2 33.6 42.2 36.5 40.5 Z" fill="url(#back)"/>

    <!-- Front continuous sweeping helix turns -->
    <path d="M13 18 C15 24 38 24.4 51 17 C51.2 20.6 46.8 23.2 41 24.8 C29 28 15.2 24.8 13 18 Z"
          fill="url(#front)"/>
    <path d="M17.6 30.2 C21.2 27.6 35 27.4 45.2 24.8 C44.2 28.6 40.5 31.4 35.2 32.8 C27.2 34.8 19.2 33.4 17.6 30.2 Z"
          fill="url(#front)"/>
    <path d="M22.5 38.6 C25.5 36.2 34.8 35.8 40.2 33.4 C39.6 36.6 36.8 39.2 33 40.4 C27.5 42.2 23.4 41 22.5 38.6 Z"
          fill="url(#front)"/>
    <path d="M27.6 46.4 C29.5 44.2 33.6 43.6 36.2 41.5 C35.5 44.8 33.2 48.8 30.5 52.6 C30 53.3 29 53.2 29 52.3 C29.1 50.2 28.4 48.4 27.6 46.4 Z"
          fill="url(#front)"/>

    <!-- Sleek highlight edge along the top front ribbon -->
    <path d="M15.8 20.4 C23.5 23 38.5 22.4 48.2 18.6" fill="none" stroke="#FFF4D2" stroke-width="1" stroke-linecap="round" stroke-opacity="0.55"/>

    <!-- Subtle ground vortex crescent -->
    <path d="M23.5 54 C27 55.6 33.5 55.6 37 53.8" fill="none" stroke="#E3344E" stroke-width="1.35" stroke-linecap="round" stroke-opacity="0.88"/>

    <!-- Dynamic flanking wind arcs -->
    <path d="M9.5 25.5 C11.5 27.6 14.5 28.5 16.5 28" fill="none" stroke="#7E91AA" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.65"/>
    <path d="M47.8 27.2 C50.6 26.4 53 24.6 54.5 22.4" fill="none" stroke="#7E91AA" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.65"/>
  </g>

  <!-- Crisp outer border -->
  <circle cx="32" cy="32" r="31" fill="none" stroke="#2D3C52" stroke-width="1.2"/>
</svg>
